<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Elite Drafting &amp; Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bone:#F7F5F0;
--charcoal:#0A0A0A;
--steel:#888;
--glass:#8FA89A;
--amber:#C17F3A;
--white:#FFFFFF;
}
html{scroll-behavior:smooth}
body{
background:var(--charcoal);
color:var(--white);
font-family:'Instrument Sans',sans-serif;
min-height:100vh;
display:flex;
flex-direction:column;
-webkit-font-smoothing:antialiased;
}

.login-page{
flex:1;
display:flex;
align-items:center;
justify-content:center;
padding:40px 24px;
}
.login-card{
background:var(--white);
border-radius:8px;
padding:48px 40px;
width:100%;
max-width:420px;
color:var(--charcoal);
}
.login-logo{
font-family:'IBM Plex Mono',monospace;
font-size:12px;
font-weight:500;
letter-spacing:0.12em;
text-transform:uppercase;
color:var(--charcoal);
text-align:center;
margin-bottom:32px;
}
.login-card h1{
font-family:'Space Grotesk',sans-serif;
font-size:28px;
font-weight:700;
letter-spacing:-0.03em;
text-align:center;
margin-bottom:8px;
}
.login-card .login-sub{
font-size:14px;
color:#888;
text-align:center;
margin-bottom:32px;
}

/* GOOGLE BTN */
.google-login{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
width:100%;
padding:14px;
background:var(--white);
border:1px solid #ddd;
border-radius:6px;
cursor:pointer;
font-family:'Instrument Sans',sans-serif;
font-size:15px;
font-weight:500;
color:var(--charcoal);
transition:all 0.3s;
margin-bottom:24px;
}
.google-login:hover{border-color:var(--charcoal);background:#fafafa}

.divider{
display:flex;
align-items:center;
gap:16px;
margin-bottom:24px;
}
.divider::before,.divider::after{
content:'';
flex:1;
height:1px;
background:#e0e0e0;
}
.divider span{
font-family:'IBM Plex Mono',monospace;
font-size:10px;
letter-spacing:0.15em;
text-transform:uppercase;
color:#aaa;
}

/* FORM */
.login-field{margin-bottom:16px}
.login-field label{
display:block;
font-family:'IBM Plex Mono',monospace;
font-size:10px;
font-weight:500;
letter-spacing:0.15em;
text-transform:uppercase;
color:#999;
margin-bottom:6px;
}
.login-field input{
width:100%;
padding:12px 0;
border:none;
border-bottom:1px solid #ddd;
font-family:'Instrument Sans',sans-serif;
font-size:16px;
color:var(--charcoal);
background:transparent;
outline:none;
transition:border-color 0.3s;
}
.login-field input:focus{border-bottom-color:var(--charcoal)}
.login-field input::placeholder{color:#ccc}

.login-submit{
width:100%;
padding:16px;
background:var(--charcoal);
color:var(--white);
border:none;
border-radius:6px;
font-family:'Instrument Sans',sans-serif;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:all 0.3s;
margin-top:8px;
text-transform:uppercase;
letter-spacing:0.06em;
}
.login-submit:hover{background:#222;transform:scale(1.01)}

.login-footer{
text-align:center;
margin-top:20px;
font-size:13px;
color:#999;
}
.login-footer a{
color:var(--charcoal);
text-decoration:underline;
text-underline-offset:2px;
font-weight:500;
}

.login-forgot{
text-align:right;
margin-top:4px;
margin-bottom:16px;
}
.login-forgot a{
font-size:12px;
color:#999;
text-decoration:none;
transition:color 0.3s;
}
.login-forgot a:hover{color:var(--charcoal)}

.back-home{
text-align:center;
padding:20px;
}
.back-home a{
font-family:'Instrument Sans',sans-serif;
font-size:13px;
color:rgba(255,255,255,0.4);
text-decoration:none;
transition:color 0.3s;
}
.back-home a:hover{color:var(--white)}

/* TABS */
.login-tabs{
display:flex;
margin-bottom:28px;
border-bottom:1px solid #eee;
}
.login-tab{
flex:1;
padding:12px;
text-align:center;
font-family:'Instrument Sans',sans-serif;
font-size:14px;
font-weight:500;
color:#999;
cursor:pointer;
border:none;
background:none;
border-bottom:2px solid transparent;
transition:all 0.3s;
}
.login-tab.active{color:var(--charcoal);border-bottom-color:var(--charcoal)}
.login-tab:hover{color:var(--charcoal)}
.tab-content{display:none}
.tab-content.active{display:block}

@media(max-width:480px){
.login-card{padding:36px 24px}
}
</style>
</head>
<body>

<div class="login-page">
<div class="login-card">
<div class="login-logo">Elite Drafting &amp; Design</div>

<div class="login-tabs">
<button class="login-tab active" data-tab="login">Log In</button>
<button class="login-tab" data-tab="signup">Sign Up</button>
</div>

<!-- LOGIN TAB -->
<div class="tab-content active" id="tab-login">
<button class="google-login" id="googleLogin">
<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.0 24.0 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
Continue with Google
</button>
<div class="divider"><span>or</span></div>
<form id="loginForm">
<div class="login-field">
<label for="login-email">Email</label>
<input type="email" id="login-email" placeholder="you@company.com" required>
</div>
<div class="login-field">
<label for="login-pass">Password</label>
<input type="password" id="login-pass" placeholder="Enter your password" required>
</div>
<div class="login-forgot"><a href="#">Forgot password?</a></div>
<button type="submit" class="login-submit">Log In</button>
</form>
</div>

<!-- SIGNUP TAB -->
<div class="tab-content" id="tab-signup">
<button class="google-login" id="googleSignup">
<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.0 24.0 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
Sign up with Google
</button>
<div class="divider"><span>or</span></div>
<form id="signupForm">
<div class="login-field">
<label for="signup-name">Full Name</label>
<input type="text" id="signup-name" placeholder="John Smith" required>
</div>
<div class="login-field">
<label for="signup-company">Company</label>
<input type="text" id="signup-company" placeholder="Your glazing company" required>
</div>
<div class="login-field">
<label for="signup-email">Email</label>
<input type="email" id="signup-email" placeholder="you@company.com" required>
</div>
<div class="login-field">
<label for="signup-pass">Password</label>
<input type="password" id="signup-pass" placeholder="Create a password" required>
</div>
<button type="submit" class="login-submit" style="margin-top:16px">Create Account</button>
</form>
<div class="login-footer">
By signing up you agree to our Terms of Service
</div>
</div>

</div>
</div>

<div class="back-home">
<a href="index.html">&larr; Back to home</a>
</div>

<script>
// Tabs
document.querySelectorAll('.login-tab').forEach(tab => {
tab.addEventListener('click', () => {
document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
tab.classList.add('active');
document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
});
});

// Login form
document.getElementById('loginForm').addEventListener('submit', (e) => {
e.preventDefault();
alert('Login functionality will be connected to your backend.');
});

// Signup form
document.getElementById('signupForm').addEventListener('submit', (e) => {
e.preventDefault();
alert('Account created! (Connect to your backend to make this functional.)');
});
</script>
</body>
</html>
